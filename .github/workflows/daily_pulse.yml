name: Daily Security Pulse

on:
  schedule:
    - cron: '0 12 * * *' # Runs at 12:00 UTC (roughly morning in the US)
  workflow_dispatch: # Allows you to run it manually to test

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to push the updated Markdown file
    steps:
      # Actions are pinned to commit SHAs: a mutable tag like @v5 can be
      # repointed at malicious code, and this job has contents: write.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # SMTP secrets are scoped to this step only, so they are never present
      # in the environment while third-party package code runs above.
      - name: Run Pulse Script
        run: python pulse.py
        env:
          EMAIL_SMTP_SERVER: ${{ secrets.EMAIL_SMTP_SERVER }}
          EMAIL_SMTP_PORT: ${{ secrets.EMAIL_SMTP_PORT }}
          EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}

      - name: Commit, Rebase, and Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add SECURITY_FEED.md seen_items.json
          git commit -m "Update Security Pulse for $(date +'%Y-%m-%d')" || true
          git fetch origin main
          git rebase origin/main
          git push origin main