# Security Pulse Configuration
# Feeds are grouped into sections by the "category" field:
#   security  -> "Vulnerabilities & Threats"
#   ai        -> "AI News & Model Releases"
#   financial -> "Financial Sector Watch"

feeds:
  cisa:
    name: "CISA Advisories"
    url: "https://www.cisa.gov/cybersecurity-advisories/all.xml"
    category: security
    enabled: true

  hackernews:
    name: "The Hacker News"
    url: "https://feeds.feedburner.com/TheHackersNews"
    category: security
    enabled: true

  wiz:
    name: "Wiz Security Blog"
    url: "https://www.wiz.io/blog/rss.xml"
    category: security
    enabled: true

  darkreading:
    name: "Dark Reading"
    url: "https://www.darkreading.com/rss.xml"
    category: security
    enabled: true

  bleepingcomputer:
    name: "BleepingComputer"
    url: "https://www.bleepingcomputer.com/feed/"
    category: security
    enabled: true

  synacktiv:
    name: "Synacktiv Security Research"
    url: "https://www.synacktiv.com/en/publications/feed.xml"
    category: security
    enabled: false

  # --- AI news & model releases ---
  techcrunch_ai:
    name: "TechCrunch AI"
    url: "https://techcrunch.com/category/artificial-intelligence/feed/"
    category: ai
    enabled: true

  verge_ai:
    name: "The Verge AI"
    url: "https://www.theverge.com/rss/ai-artificial-intelligence/index.xml"
    category: ai
    enabled: true

  simonwillison:
    name: "Simon Willison (LLMs)"
    url: "https://simonwillison.net/atom/everything/"
    category: ai
    enabled: true

  huggingface:
    name: "Hugging Face Blog"
    url: "https://huggingface.co/blog/feed.xml"
    category: ai
    enabled: true

  # --- Financial sector (banking, payments, fintech) ---
  # Capped low and keyword-filtered so it never crowds out the AI section.
  pymnts:
    name: "PYMNTS"
    url: "https://www.pymnts.com/feed/"
    category: financial
    enabled: true
    max_entries: 4              # per-feed override of output.max_entries_per_feed
    filter: financial           # only keep entries the tagger accepts

# CISA Known Exploited Vulnerabilities catalog (highest-signal vuln data).
# Rendered as its own top section with severity/ransomware badges.
kev:
  enabled: true
  url: "https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json"
  max_entries: 8
  max_age_days: 7             # never backfill CVEs added longer ago than this

# Section grouping / display order for the digest.
# Order here IS the order in the email. "financial" is deliberately last so it
# is strictly additive and never displaces the AI section.
sections:
  - key: security
    title: "Vulnerabilities & Threats"
    emoji: "🛡️"
    accent: "#d64545"
    count_label: "threat stories"
  - key: ai
    title: "AI News & Model Releases"
    emoji: "🤖"
    accent: "#6d5bd0"
    count_label: "AI updates"
  - key: financial
    title: "Financial Sector Watch"
    emoji: "🏦"
    accent: "#0f766e"
    count_label: "finance items"
    subtitle: "Banking, payments & fintech — cyber and AI"
    max_items: 5                # hard cap on cards in this section

# Deterministic keyword relevance tagging. No LLM / API calls.
#
# Cross-tagged items (stories from the security/AI feeds) must match a finance
# term AND a cyber term, and clear a weighted score threshold. This two-gate
# design exists because a naive keyword match produced false positives on CISA
# ICS advisories (stray "card" / "SEC" hits) during testing.
tagging:
  financial:
    enabled: true
    min_score: 2                # finance_strong=2, finance_weak=1
    max_crossref: 6             # cap on compact cross-reference one-liners

    # Weight 2 — one of these alone is enough to clear min_score.
    finance_strong:
      - "financial institution"
      - "financial services"
      - "financial sector"
      - "banking"
      - "bank"
      - "banks"
      - "credit union"
      - "payment card"
      - "credit card"
      - "debit card"
      - "cardholder"
      - "card issuer"
      - "payment processor"
      - "payment network"
      - "core banking"
      - "swift network"
      - "wire transfer"
      - "wire fraud"
      - "fintech"
      - "brokerage"
      - "insurer"
      - "capital markets"
      - "PCI DSS"
      - "DORA"
      - "GLBA"
      - "FFIEC"
      - "FinCEN"
      - "FDIC"
      - "NCUA"
      - "SEC filing"
      - "SEC disclosure"
      - "anti-money laundering"

    # Weight 1 — never sufficient on their own (too generic).
    finance_weak:
      - "fraud"
      - "payments"
      - "atm"
      - "trading"
      - "treasury"
      - "loan"
      - "mortgage"
      - "money laundering"
      - "chargeback"
      - "kyc"

    # Cross-tagged items must ALSO match one of these.
    cyber_terms:
      - "vulnerability"
      - "vulnerabilities"
      - "cve-"
      - "exploit"
      - "exploited"
      - "zero-day"
      - "0-day"
      - "ransomware"
      - "breach"
      - "malware"
      - "phishing"
      - "threat actor"
      - "attack"
      - "attackers"
      - "compromise"
      - "patch"
      - "backdoor"
      - "credential"
      - "supply chain"
      - "incident response"
      - "ai"                    # word-boundary matched, so "said"/"main" don't hit
      - "artificial intelligence"
      - "machine learning"
      - "agentic ai"
      - "deepfake"
      - "llm"
      - "genai"
      - "ai model"
      - "ai agent"
      - "ai agents"

    # Hard veto regardless of score — the measured false-positive sources.
    exclude_patterns:
      - "ICS Advisory"
      - "ICS Medical Advisory"
      - "Mitsubishi"
      - "Siemens"
      - "Schneider Electric"
      - "Rockwell"
      - "Hitachi Energy"
      - "Delta Electronics"

    # Matched against KEV vendorProject + product only (not free text).
    kev_vendors:
      - "Fortinet"
      - "Citrix"
      - "Ivanti"
      - "VMware"
      - "Cisco"
      - "Check Point"
      - "Palo Alto"
      - "SonicWall"
      - "Juniper"
      - "F5"
      - "MOVEit"
      - "GoAnywhere"
      - "Fortra"
      - "Veeam"
      - "Commvault"
      - "SolarWinds"
      - "Atlassian"
      - "Splunk"
      - "Zoho"
      - "ManageEngine"
      - "SharePoint"
      - "Exchange"
      - "E-Business Suite"
      - "WebLogic"
      - "Oracle Fusion"
      - "Zimbra"
      - "PaperCut"
      # Deliberately NOT listed: Windows, Adobe, Apache. Every org runs them,
      # so badging them makes FINANCIAL meaningless. This list targets the
      # edge/enterprise stack that defines the financial-sector attack surface.

# Freshness policy — each digest contains only items not sent before.
state:
  file: "seen_items.json"     # committed by the workflow alongside SECURITY_FEED.md
  lookback_hours: 26          # daily cadence + 2h overlap so nothing slips between runs
  retention_days: 30          # how long to remember sent items
  recap_hours: 48             # collapsed "Earlier articles" covers this window

# Output settings
output:
  file: "SECURITY_FEED.md"
  max_entries_per_feed: 5     # default cap; feeds may override with max_entries
  summary_length: 220

# Feed fetch settings
fetch:
  timeout: 20
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0 Safari/537.36"

email:
  enabled: true
  smtp_server: ""
  smtp_port: 587
  use_ssl: false
  username: ""
  from: "security-pulse@example.com"
  to: "your-email@example.com"
  subject: "🛡️ Security Pulse — Daily Digest"

# The email password should be stored in a secret and passed through EMAIL_PASSWORD.
