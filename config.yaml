# Security Pulse Configuration
# Feeds are grouped into sections by the "category" field:
#   security -> "Vulnerabilities & Threats"
#   ai       -> "AI News & Model Releases"

feeds:
  cisa:
    name: "CISA Advisories"
    url: "https://www.cisa.gov/cybersecurity-advisories/all.xml"
    category: security
    enabled: true

  hackernews:
    name: "The Hacker News"
    url: "https://feeds.feedburner.com/TheHackersNews"
    category: security
    enabled: true

  wiz:
    name: "Wiz Security Blog"
    url: "https://www.wiz.io/blog/rss.xml"
    category: security
    enabled: true

  darkreading:
    name: "Dark Reading"
    url: "https://www.darkreading.com/rss.xml"
    category: security
    enabled: true

  synacktiv:
    name: "Synacktiv Security Research"
    url: "https://www.synacktiv.com/en/publications/feed.xml"
    category: security
    enabled: false

  # --- AI news & model releases ---
  techcrunch_ai:
    name: "TechCrunch AI"
    url: "https://techcrunch.com/category/artificial-intelligence/feed/"
    category: ai
    enabled: true

  verge_ai:
    name: "The Verge AI"
    url: "https://www.theverge.com/rss/ai-artificial-intelligence/index.xml"
    category: ai
    enabled: true

  simonwillison:
    name: "Simon Willison (LLMs)"
    url: "https://simonwillison.net/atom/everything/"
    category: ai
    enabled: true

# CISA Known Exploited Vulnerabilities catalog (highest-signal vuln data).
# Rendered as its own top section with severity/ransomware badges.
kev:
  enabled: true
  url: "https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json"
  max_entries: 8
  max_age_days: 7             # never backfill CVEs added longer ago than this

# Section grouping / display order for the digest
sections:
  - key: security
    title: "Vulnerabilities & Threats"
    emoji: "🛡️"
  - key: ai
    title: "AI News & Model Releases"
    emoji: "🤖"

# Freshness policy — each digest contains only items not sent before.
state:
  file: "seen_items.json"     # committed by the workflow alongside SECURITY_FEED.md
  lookback_hours: 26          # daily cadence + 2h overlap so nothing slips between runs
  retention_days: 30          # how long to remember sent items

# Output settings
output:
  file: "SECURITY_FEED.md"
  max_entries_per_feed: 5
  include_description: true
  sort_by_date: true
  summary_length: 220

# Feed fetch settings
fetch:
  timeout: 20
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0 Safari/537.36"

email:
  enabled: true
  smtp_server: ""
  smtp_port: 587
  use_ssl: false
  username: ""
  from: "security-pulse@example.com"
  to: "your-email@example.com"
  subject: "🛡️ Security Pulse — Daily Digest"

# The email password should be stored in a secret and passed through EMAIL_PASSWORD.
